name: nfsu-placement

services:
  api:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@host.docker.internal:3306/${MYSQL_DATABASE}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      FERNET_KEY: ${FERNET_KEY}
      SEED: ${SEED}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TRUST_PROXY: ${TRUST_PROXY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_HOURS: ${SESSION_HOURS}
      IDLE_MINUTES: ${IDLE_MINUTES}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OFFICER_PASSWORD: ${OFFICER_PASSWORD}
      COORDINATOR_PASSWORD: ${COORDINATOR_PASSWORD}
      RECRUITER_PASSWORD: ${RECRUITER_PASSWORD}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}
        OFFICER_PASSWORD: ${OFFICER_PASSWORD}
        COORDINATOR_PASSWORD: ${COORDINATOR_PASSWORD}
        RECRUITER_PASSWORD: ${RECRUITER_PASSWORD}
        STUDENT_PASSWORD: ${STUDENT_PASSWORD}
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy
